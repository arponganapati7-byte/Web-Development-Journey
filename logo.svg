<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a1a" />
      <stop offset="50%" stop-color="#121331" />
      <stop offset="100%" stop-color="#080814" />
    </linearGradient>

    <!-- Periwinkle / Indigo Gradient for Letter 'A' -->
    <linearGradient id="bubbly-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b4fc" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Cyan Glow Accent (Profile Ring) -->
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Dark Background Container -->
  <rect width="64" height="64" rx="18" fill="url(#bg-grad)" stroke="#1e1b4b" stroke-width="1.5" />

  <!-- Bubbly Outer 'A' Structure -->
  <path d="M 32 12 C 34.5 12, 36 13.5, 37.2 16 L 47 42 C 48 44.8, 46.5 48, 43.5 48 C 41.5 48, 40 46.8, 39 44.5 L 36.8 38 H 27.2 L 25 44.5 C 24 46.8, 22.5 48, 20.5 48 C 17.5 48, 16 44.8, 17 42 L 26.8 16 C 28 13.5, 29.5 12, 32 12 Z" 
        fill="url(#bubbly-grad)" />

  <!-- Bubbly Inner Counter / Hole -->
  <path d="M 32 21 C 32.8 21, 33.3 22, 33.8 23.5 L 35.3 32 H 28.7 L 30.2 23.5 C 30.7 22, 31.2 21, 32 21 Z" 
        fill="#0d0e26" />

  <!-- Soft Cyan Bubble Accent Ring Dot -->
  <circle cx="46" cy="17" r="4.5" fill="url(#cyan-glow)" />
</svg>
